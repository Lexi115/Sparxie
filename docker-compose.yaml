services:
  gateway:
    container_name: gateway
    build:
      context: ./gateway
    ports:
      - "8080:8080"
    env_file:
      - ./gateway/.env
    restart: always
    profiles:
      - all
      - user
      - game
      - gacha
      - inventory
      - shop

  game:
    container_name: game
    build:
      context: ./game
    ports:
      - "8081:8080"
    env_file:
      - ./game/.env
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles:
      - all
      - game
      - gacha
      - inventory
      - shop

  gacha:
    container_name: gacha
    build:
      context: ./gacha
    ports:
      - "8082:8080"
    env_file:
      - ./gacha/.env
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
      mongo-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles:
      - all
      - game
      - gacha

  inventory:
    container_name: inventory
    build:
      context: ./inventory
    ports:
      - "8083:8080"
    env_file:
      - ./inventory/.env
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
      mongo-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles:
      - all
      - game
      - inventory

  shop:
    container_name: shop
    build:
      context: ./shop
    ports:
      - "8084:8080"
    env_file:
      - ./shop/.env
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mongo-setup:
        condition: service_completed_successfully
    profiles:
      - all
      - game
      - shop

  user:
    container_name: user
    build:
      context: ./user
    ports:
      - "8085:8080"
    env_file:
      - ./user/.env
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      supabase:
        condition: service_healthy
      supabase-setup:
        condition: service_completed_successfully
    profiles:
      - all
      - user

  logger:
    container_name: logger
    build:
      context: ./logger
    ports:
      - "8086:8080"
    env_file:
      - ./logger/.env
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles:
      - all
      - user
      - game
      - logger

  postgres:
    image: postgres:18.6
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    profiles:
      - all
      - game
      - gacha
      - inventory
      - shop
      - user
      - logger

  mongo:
    image: mongo:8.3-noble
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    restart: always
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27017", "--quiet" ]
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/27017' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - all
      - game
      - gacha
      - inventory
      - shop

  mongo-setup:
    image: mongo:8.3-noble
    container_name: mongo-setup
    tmpfs:
      - /data/db
      - /data/configdb
    command: >
      bash -c "sleep 3 && mongosh --host mongo --port 27017 --quiet --eval \"try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }\""
    depends_on:
      mongo:
        condition: service_healthy
    profiles:
      - all
      - game
      - gacha
      - inventory
      - shop

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092" # Internal (Docker)
      - "9094:9094" # External (Host)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_config:/mnt/shared/config
      - kafka_secrets:/etc/kafka/secrets
    profiles:
      - all
      - game
      - gacha
      - inventory
      - shop
      - user
      - logger

  redis:
    image: redis:8.10-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - redis_data:/data
    profiles:
      - all
      - game
      - gacha
      - inventory
      - shop

  supabase:
    image: supabase/gotrue:v2.158.1
    container_name: supabase
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:8080/api/auth
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@postgres:5432/supabase_db?options=-c%20search_path%3Dauth
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SITE_URL: http://localhost:8080
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # Google Authentication
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOOGLE_CLIENT_REDIRECT_URI}
      # GitHub Authentication
      GOTRUE_EXTERNAL_GITHUB_ENABLED: "true"
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${GITHUB_CLIENT_REDIRECT_URI}
      # Discord Authentication
      GOTRUE_EXTERNAL_DISCORD_ENABLED: "true"
      GOTRUE_EXTERNAL_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      GOTRUE_EXTERNAL_DISCORD_SECRET: ${DISCORD_CLIENT_SECRET}
      GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI: ${DISCORD_CLIENT_REDIRECT_URI}
      # Twitch Authentication
      GOTRUE_EXTERNAL_TWITCH_ENABLED: "true"
      GOTRUE_EXTERNAL_TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      GOTRUE_EXTERNAL_TWITCH_SECRET: ${TWITCH_CLIENT_SECRET}
      GOTRUE_EXTERNAL_TWITCH_REDIRECT_URI: ${TWITCH_CLIENT_REDIRECT_URI}
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - all
      - user

  supabase-setup:
    image: alpine:3.20
    container_name: supabase-setup
    volumes:
      - ./db/postgres/supabase-init.sql:/supabase-init.sql
    command: >
      sh -c "apk add --no-cache postgresql-client && PGPASSWORD=postgres psql -h postgres -U postgres -d supabase_db -f /supabase-init.sql"
    depends_on:
      supabase:
        condition: service_healthy
    profiles:
      - all
      - user

volumes:
  kafka_data:
  kafka_config:
  kafka_secrets:
  redis_data:
  postgres_data:
  mongo_data:
  mongo_config:
