services:
  gacha:
    container_name: gacha
    build:
      context: ./gacha
    ports:
      - "8082:8080"
    restart: on-failure

  game:
    container_name: game
    build:
      context: ./game
    ports:
      - "8081:8080"
    restart: on-failure
    depends_on:
      - gacha

  gateway:
    container_name: gateway
    build:
      context: ./gateway
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      - game
