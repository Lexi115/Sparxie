services:
  gateway:
    container_name: gateway
    build:
      context: ./gateway
    env_file:
      - ./gateway/.env
    ports:
      - "8080:8080"
    restart: on-failure
    profiles:
      - game
      - user

  game:
    container_name: game
    build:
      context: ./game
    env_file:
      - ./game/.env
    ports:
      - "8081:8080"
    restart: on-failure
    profiles:
      - game

  gacha:
    container_name: gacha
    build:
      context: ./gacha
    env_file:
      - ./gacha/.env
    ports:
      - "8082:8080"
    restart: on-failure
    volumes:
      - gacha_data:/var/lib/sparxie/gacha
    profiles:
      - game

  inventory:
    container_name: inventory
    build:
      context: ./inventory
    env_file:
      - ./inventory/.env
    ports:
      - "8083:8080"
    restart: on-failure
    profiles:
      - game

  shop:
    container_name: shop
    build:
      context: ./shop
    env_file:
      - ./shop/.env
    ports:
      - "8084:8080"
    restart: on-failure
    profiles:
      - game

  user:
    container_name: user
    build:
      context: ./user
    env_file:
      - ./user/.env
    ports:
      - "8085:8080"
    restart: on-failure
    profiles:
      - user

volumes:
  gacha_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${GACHA_DATA_PATH}"
