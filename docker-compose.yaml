services:
  gateway:
    container_name: gateway
    build:
      context: ./gateway
    ports:
      - "8080:8080"
    env_file:
      - ./gateway/.env
    restart: on-failure
    profiles:
      - game
      - user
      - all

  game:
    container_name: game
    build:
      context: ./game
    ports:
      - "8081:8080"
    env_file:
      - ./game/.env
    restart: on-failure
    depends_on:
      - kafka
    profiles:
      - game
      - all

  gacha:
    container_name: gacha
    build:
      context: ./gacha
    ports:
      - "8082:8080"
    env_file:
      - ./gacha/.env
    restart: on-failure
    volumes:
      - gacha_data:/var/lib/sparxie/gacha
    depends_on:
      - redis
      - kafka
    profiles:
      - game
      - all

  inventory:
    container_name: inventory
    build:
      context: ./inventory
    ports:
      - "8083:8080"
    env_file:
      - ./inventory/.env
    restart: on-failure
    depends_on:
      - redis
      - kafka
    profiles:
      - game
      - all

  shop:
    container_name: shop
    build:
      context: ./shop
    ports:
      - "8084:8080"
    env_file:
      - ./shop/.env
    restart: on-failure
    depends_on:
      - redis
    profiles:
      - game
      - all

  user:
    container_name: user
    build:
      context: ./user
    ports:
      - "8085:8080"
    env_file:
      - ./user/.env
    restart: on-failure
    depends_on:
      - kafka
      - postgres
    profiles:
      - user
      - all

  postgres:
    image: postgres:18.6
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092" # Internal (Docker)
      - "9094:9094" # External (Host)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    restart: always
    profiles:
      - user
      - game
      - all

  redis:
    image: redis:8.10-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data
    profiles:
      - game
      - all

volumes:
  gacha_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${GACHA_DATA_PATH}"
  redis_data:
  postgres_data:
