spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Game Microservice
            - id: game
              uri: ${GAME_SERVICE_BASE_URI:http://game:8080}
              predicates:
                - Path=/api/game/**
              filters:
                - StripPrefix=1
            # Banner Microservice
            - id: banner
              uri: ${BANNER_SERVICE_BASE_URI:http://game:8080}
              predicates:
                - Path=/api/banner/**
              filters:
                - StripPrefix=1
