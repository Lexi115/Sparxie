spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Game
            - id: game
              uri: ${GAME_SERVICE_BASE_URI}
              predicates:
                - Path=/api/game/**
              filters:
                - StripPrefix=1
            # Banners
            - id: banners
              uri: ${GAME_SERVICE_BASE_URI}
              predicates:
                - Path=/api/banners/**
              filters:
                - StripPrefix=1
            # Inventories
            - id: inventories
              uri: ${GAME_SERVICE_BASE_URI}
              predicates:
                - Path=/api/inventories/**
              filters:
                - StripPrefix=1
            # Characters
            - id: characters
              uri: ${GAME_SERVICE_BASE_URI}
              predicates:
                - Path=/api/characters/**
              filters:
                - StripPrefix=1
            # Weapons
            - id: weapons
              uri: ${GAME_SERVICE_BASE_URI}
              predicates:
                - Path=/api/weapons/**
              filters:
                - StripPrefix=1
            # Materials
            - id: materials
              uri: ${GAME_SERVICE_BASE_URI}
              predicates:
                - Path=/api/materials/**
              filters:
                - StripPrefix=1
            # Profiles
            - id: profiles
              uri: ${USER_SERVICE_BASE_URI}
              predicates:
                - Path=/api/profiles/**
              filters:
                - StripPrefix=1
            # Authentication
            - id: auth
              uri: ${USER_SERVICE_BASE_URI}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
