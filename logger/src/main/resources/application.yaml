spring:
  application:
    name: logger
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  liquibase:
    enabled: true
  cache:
    type: caffeine
    cache-names: warps_performed, purchases_performed, users_created, users_deleted
    caffeine:
      spec: expireAfterWrite=12h,maximumSize=1000
  kafka:
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
    properties:
      spring.json.trusted.packages: "*"
      spring.json.type.mapping: >
        USER_CREATED:io.lexi115.sparxie.logger.users.events.UserCreatedEvent,
        USER_DELETED:io.lexi115.sparxie.logger.users.events.UserDeletedEvent,
        WARP_PERFORMED:io.lexi115.sparxie.logger.warps.events.WarpPerformedEvent,
        PURCHASE_PERFORMED:io.lexi115.sparxie.logger.shop.events.PurchasePerformedEvent
    bootstrap-servers:
      - ${KAFKA_SERVER}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  kafka:
    topic:
      user: user-topic
      shop: shop-topic
      warp: warp-topic
    group:
      logger: logger-group
