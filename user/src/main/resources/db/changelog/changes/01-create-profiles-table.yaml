databaseChangeLog:
  - changeSet:
      id: 01-create-profiles-table
      author: Lexi115
      changes:
        - createTable:
            tableName: profiles
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
