info:
  name: Get player warp history
  type: http
  seq: 1

http:
  method: GET
  url: "{{loggerBaseUri}}/warps/{{userId}}/{{bannerType}}"
  auth: inherit

runtime:
  variables:
    - name: bannerType
      value: character_event

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
