info:
  name: Pull
  type: http
  seq: 1

http:
  method: POST
  url: "{{gachaBaseUri}}/warps"
  headers:
    - name: X-User-Id
      value: "{{userId}}"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "bannerId": "{{bannerId}}",
        "amount": {{pullAmount}}
      }
  auth: inherit

runtime:
  variables:
    - name: bannerId
      value: banner_standard_event
    - name: pullAmount
      value: "10"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
