info:
  name: Get banner details
  type: http
  seq: 2

http:
  method: GET
  url: "{{gachaBaseUri}}/banner/details/{{bannerId}}"
  auth: inherit

runtime:
  variables:
    - name: bannerId
      value: banner_standard_event

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
