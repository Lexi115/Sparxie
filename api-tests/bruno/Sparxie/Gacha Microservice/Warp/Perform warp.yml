info:
  name: Perform warp
  type: http
  seq: 1

http:
  method: POST
  url: "{{gachaBaseUri}}/warp/pull"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "playerId": "{{playerId}}",
        "bannerId": "{{bannerId}}",
        "amount": {{pullAmount}}
      }
  auth: inherit

runtime:
  variables:
    - name: playerId
      value: f4317bef-93a7-4c62-9784-61c64ae95906
    - name: bannerId
      value: banner_standard_event
    - name: pullAmount
      value: "10"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
