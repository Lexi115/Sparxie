info:
  name: Update password
  type: http
  seq: 4

http:
  method: POST
  url: "{{userBaseUri}}/auth/update-password"
  headers:
    - name: X-User-Id
      value: "{{userId}}"
  body:
    type: json
    data: |-
      {
        "password": "{{newPassword}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
