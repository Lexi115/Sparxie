info:
  name: Register
  type: http
  seq: 3

http:
  method: POST
  url: "{{userBaseUri}}/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
