info:
  name: Refresh user token
  type: http
  seq: 1

http:
  method: POST
  url: "{{userBaseUri}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "userId": "{{userId}}",
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  variables:
    - name: userId
      value: e2217fe7-2978-4595-a489-0490e6b72c62
    - name: refreshToken
      value: boia

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
