info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{userBaseUri}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  variables:
    - name: username
      value: sparkle
    - name: password
      value: feetus
    - name: email
      value: a@a.it

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
