info:
  name: Update user password
  type: http
  seq: 1

http:
  method: PUT
  url: "{{userBaseUri}}/auth/admin/users/{{userId}}/password"
  body:
    type: json
    data: |-
      {
        "password": "{{$randomPassword}}"
      }
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status != 204) {
          return;
        }
        var reqData = req.getBody();
        bru.setEnvVar("password", reqData.password);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
