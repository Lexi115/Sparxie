info:
  name: Create user
  type: http
  seq: 3

http:
  method: POST
  url: "{{userBaseUri}}/auth/admin/users"
  body:
    type: json
    data: |-
      {
        "username": "{{$randomUserName}}",
        "email": "{{$randomEmail}}",
        "isEmailConfirmed": true,
        "password": "{{$randomPassword}}",
        "roles": [
          "ADMIN", "MEMBER"
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
