info:
  name: Authorize (OAuth2)
  type: http
  seq: 6

http:
  method: GET
  url: "{{userBaseUri}}/auth/authorize/{{provider}}"
  auth: inherit

runtime:
  variables:
    - name: provider
      value: google

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
