info:
  name: Delete account
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{userBaseUri}}/auth/account"
  headers:
    - name: X-User-Id
      value: "{{userId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
