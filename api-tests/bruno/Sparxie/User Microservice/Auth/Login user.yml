info:
  name: Login user
  type: http
  seq: 1

http:
  method: POST
  url: "{{userBaseUri}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  variables:
    - name: username
      value: sparkle
    - name: password
      value: feet

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
