info:
  name: Change password
  type: http
  seq: 2

http:
  method: POST
  url: "{{userBaseUri}}/auth/change-password"
  body:
    type: json
    data: |-
      {
        "userId": "{{userId}}",
        "oldPassword": "{{oldPassword}}",
        "newPassword": "{{newPassword}}"
      }
  auth: inherit

runtime:
  variables:
    - name: userId
      value: e2217fe7-2978-4595-a489-0490e6b72c62
    - name: refreshToken
      value: boia
    - name: newPassword
      value: feet
    - name: oldPassword
      value: feet

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
