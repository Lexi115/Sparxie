info:
  name: Refresh token
  type: http
  seq: 2

http:
  method: POST
  url: "{{userBaseUri}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status != 200) {
          return;
        }
        var resData = res.getBody();
        bru.setEnvVar("accessToken", resData.accessToken);
        bru.setEnvVar("refreshToken", resData.refreshToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
