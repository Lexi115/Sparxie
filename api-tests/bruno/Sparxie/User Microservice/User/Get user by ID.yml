info:
  name: Get user by ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{userBaseUri}}/user/{{userId}}"
  auth: inherit

runtime:
  variables:
    - name: userId
      value: 00000000-0000-0000-0000-000000000000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
