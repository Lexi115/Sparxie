info:
  name: Get user by ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{userBaseUri}}/user/{{userId}}"
  auth: inherit

runtime:
  variables:
    - name: userId
      value: 809b3f0b-aba6-473d-b40a-62da439f1780

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
