info:
  name: Get material by ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{inventoryBaseUri}}/material/{{materialId}}"
  auth: inherit

runtime:
  variables:
    - name: characterId
      value: char_sparkle
    - name: weaponId
      value: lc_earthly_escapades
    - name: materialId
      value: stellar_jade

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
