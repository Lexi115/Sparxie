info:
  name: Give items
  type: http
  seq: 1

http:
  method: POST
  url: "{{inventoryBaseUri}}/inventory/give"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "playerId": "{{playerId}}",
        "items": {
          "{{itemId}}": {{itemAmount}}
        }
      }
  auth: inherit

runtime:
  variables:
    - name: playerId
      value: eb0fdb32-9aa0-44b8-985c-fc63d339898d
    - name: itemId
      value: limited_ticket
    - name: itemAmount
      value: "160"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
