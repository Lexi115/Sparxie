info:
  name: Give items
  type: http
  seq: 1

http:
  method: POST
  url: "{{inventoryBaseUri}}/inventory/give"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "playerId": "{{playerId}}",
        "items": {
          "{{itemId}}": {{itemAmount}}
        }
      }
  auth: inherit

runtime:
  variables:
    - name: playerId
      value: 51b449e8-dcb7-4ef1-b465-7cc193c39a25
    - name: itemId
      value: oneiric_shard
    - name: itemAmount
      value: "160"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
