info:
  name: Give items
  type: http
  seq: 4

http:
  method: POST
  url: "{{inventoryBaseUri}}/inventories/{{userId}}/give"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "playerId": "{{playerId}}",
        "items": {
          "{{itemId}}": {{itemAmount}}
        }
      }
  auth: inherit

runtime:
  variables:
    - name: playerId
      value: "{{userId}}"
    - name: itemId
      value: limited_ticket
    - name: itemAmount
      value: "30"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
