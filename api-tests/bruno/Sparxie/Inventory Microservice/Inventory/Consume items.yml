info:
  name: Consume items
  type: http
  seq: 2

http:
  method: POST
  url: "{{inventoryBaseUri}}/inventory/consume"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "playerId": "{{playerId}}",
        "items": {
          "{{itemId}}": {{itemAmount}}
        }
      }
  auth: inherit

runtime:
  variables:
    - name: playerId
      value: 00000000-0000-0000-0000-000000000000
    - name: itemId
      value: oneiric_shard
    - name: itemAmount
      value: "1600"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
