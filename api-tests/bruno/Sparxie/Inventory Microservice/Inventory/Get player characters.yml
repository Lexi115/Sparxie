info:
  name: Get player characters
  type: http
  seq: 1

http:
  method: GET
  url: "{{inventoryBaseUri}}/inventories/{{userId}}/characters?page={{page}}"
  params:
    - name: page
      value: "{{page}}"
      type: query
    - name: size
      value: "{{size}}"
      type: query
      disabled: true
  auth: inherit

runtime:
  variables:
    - name: page
      value: "0"
    - name: size
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
