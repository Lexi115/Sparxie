info:
  name: Get weapon by ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{inventoryBaseUri}}/weapon/{{weaponId}}"
  auth: inherit

runtime:
  variables:
    - name: characterId
      value: char_sparkle
    - name: weaponId
      value: lc_earthly_escapade

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
