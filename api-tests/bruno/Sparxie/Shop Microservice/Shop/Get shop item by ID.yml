info:
  name: Get shop item by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{shopBaseUri}}/shop/items/{{itemId}}"
  auth: inherit

runtime:
  variables:
    - name: itemId
      value: limited_ticket

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
