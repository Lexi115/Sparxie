info:
  name: Purchase Item
  type: http
  seq: 1

http:
  method: POST
  url: "{{shopBaseUri}}/shop/purchases"
  headers:
    - name: X-User-Id
      value: "{{userId}}"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "itemId": "{{itemId}}",
        "amount": {{itemAmount}}
      }
  auth: inherit

runtime:
  variables:
    - name: playerId
      value: "{{userId}}"
    - name: itemId
      value: stellar_jade
    - name: itemAmount
      value: "1600"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
