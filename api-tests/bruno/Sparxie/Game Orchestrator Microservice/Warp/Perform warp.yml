info:
  name: Perform warp
  type: http
  seq: 1

http:
  method: POST
  url: "{{gameBaseUri}}/game/warp/pull"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "playerId": "{{playerId}}",
        "bannerId": "{{bannerId}}",
        "amount": {{pullAmount}}
      }
  auth: inherit

runtime:
  variables:
    - name: playerId
      value: 195e5a8c-c67a-4587-a085-4097ee37a769
    - name: bannerId
      value: banner_character_event_sparkle_01
    - name: pullAmount
      value: "10"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
