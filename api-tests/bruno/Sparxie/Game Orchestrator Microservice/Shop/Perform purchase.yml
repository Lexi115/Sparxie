info:
  name: Perform purchase
  type: http
  seq: 1

http:
  method: POST
  url: "{{gameBaseUri}}/game/shop/purchase"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "playerId": "{{playerId}}",
        "itemId": "{{itemId}}",
        "amount": {{itemAmount}}
      }
  auth: inherit

runtime:
  variables:
    - name: playerId
      value: 195e5a8c-c67a-4587-a085-4097ee37a761
    - name: bannerId
      value: banner_standard_event
    - name: pullAmount
      value: "10"
    - name: itemId
      value: oneiric_shard
    - name: itemAmount
      value: "10"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
