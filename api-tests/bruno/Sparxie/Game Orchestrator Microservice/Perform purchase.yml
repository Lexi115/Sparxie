info:
  name: Perform purchase
  type: http
  seq: 4

http:
  method: POST
  url: "{{gameBaseUri}}/game/purchases"
  headers:
    - name: X-User-Id
      value: "{{userId}}"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "itemId": "{{itemId}}",
        "amount": {{itemAmount}}
      }
  auth: inherit

runtime:
  variables:
    - name: pullAmount
      value: "10"
    - name: itemId
      value: oneiric_shard
    - name: itemAmount
      value: "10"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
