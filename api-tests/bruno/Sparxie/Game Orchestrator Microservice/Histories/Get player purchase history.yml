info:
  name: Get player purchase history
  type: http
  seq: 1

http:
  method: GET
  url: "{{gameBaseUri}}/histories/purchases"
  headers:
    - name: X-User-Id
      value: "{{userId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
