info:
  name: Get warp history
  type: http
  seq: 1

http:
  method: GET
  url: "{{gameBaseUri}}/histories/warps/{{bannerType}}"
  headers:
    - name: X-User-Id
      value: "{{userId}}"
  auth: inherit

runtime:
  variables:
    - name: bannerType
      value: character_event

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
