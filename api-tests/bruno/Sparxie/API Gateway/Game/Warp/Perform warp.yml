info:
  name: Perform warp
  type: http
  seq: 1

http:
  method: POST
  url: "{{gatewayBaseUri}}/api/game/warp/pull"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "bannerId": "{{bannerId}}",
        "amount": {{pullAmount}}
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  variables:
    - name: playerId
      value: a1ef00f5-c29b-4edc-ab2d-6266b94ace3e
    - name: bannerId
      value: banner_character_event_sparkle_01
    - name: pullAmount
      value: "10"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
