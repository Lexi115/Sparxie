info:
  name: Perform purchase
  type: http
  seq: 1

http:
  method: POST
  url: "{{gatewayBaseUri}}/api/game/shop/purchase"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "itemId": "{{itemId}}",
        "amount": {{itemAmount}}
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: bannerId
      value: banner_standard_event
    - name: pullAmount
      value: "10"
    - name: itemId
      value: limited_ticket
    - name: itemAmount
      value: "100"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
