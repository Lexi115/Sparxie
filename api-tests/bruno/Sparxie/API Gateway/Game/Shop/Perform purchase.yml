info:
  name: Perform purchase
  type: http
  seq: 1

http:
  method: POST
  url: "{{gatewayBaseUri}}/api/game/shop/purchase"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "itemId": "{{itemId}}",
        "amount": {{itemAmount}}
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  variables:
    - name: playerId
      value: 1bbad0cc-4a14-4c5e-8254-f851ffa30907
    - name: bannerId
      value: banner_standard_event
    - name: pullAmount
      value: "10"
    - name: itemId
      value: oneiric_shard
    - name: itemAmount
      value: "1600"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
