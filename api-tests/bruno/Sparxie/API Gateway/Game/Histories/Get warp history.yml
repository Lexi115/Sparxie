info:
  name: Get warp history
  type: http
  seq: 1

http:
  method: GET
  url: "{{gatewayBaseUri}}/api/histories/warps/{{bannerType}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: bannerType
      value: character_event

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
