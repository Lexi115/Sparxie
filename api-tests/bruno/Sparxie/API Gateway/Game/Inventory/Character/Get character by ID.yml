info:
  name: Get character by ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{gatewayBaseUri}}/api/character/{{characterId}}"
  auth: inherit

runtime:
  variables:
    - name: characterId
      value: char_sparkle

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
