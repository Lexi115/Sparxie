info:
  name: Get material by ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{gatewayBaseUri}}/api/materials/{{materialId}}"
  auth: inherit

runtime:
  variables:
    - name: materialId
      value: stellar_jade

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
