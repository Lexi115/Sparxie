info:
  name: Perform warp
  type: http
  seq: 2

http:
  method: POST
  url: "{{gatewayBaseUri}}/api/game/warps"
  body:
    type: json
    data: |-
      {
        "transactionId": "{{$randomUUID}}",
        "bannerId": "{{bannerId}}",
        "amount": {{pullAmount}}
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: bannerId
      value: banner_character_event_sparkle_01
    - name: pullAmount
      value: "10"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
