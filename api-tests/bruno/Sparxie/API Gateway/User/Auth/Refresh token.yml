info:
  name: Refresh token
  type: http
  seq: 3

http:
  method: POST
  url: "{{gatewayBaseUri}}/api/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  variables:
    - name: refreshToken
      value: EwJk69Ph4MzuvQopGIy9YA

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
