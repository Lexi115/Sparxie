info:
  name: Refresh token
  type: http
  seq: 3

http:
  method: POST
  url: "{{gatewayBaseUri}}/api/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        bru.setEnvVar("accessToken", data.accessToken);
        bru.setEnvVar("refreshToken", data.refreshToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
