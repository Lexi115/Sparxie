info:
  name: Update password
  type: http
  seq: 5

http:
  method: POST
  url: "{{gatewayBaseUri}}/api/auth/update-password"
  body:
    type: json
    data: |-
      {
        "password": "{{newPassword}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: newPassword
      value: feetus

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
