info:
  name: Update password
  type: http
  seq: 5

http:
  method: PUT
  url: "{{gatewayBaseUri}}/api/auth/password"
  body:
    type: json
    data: |-
      {
        "password": "{{$randomPassword}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status != 204) {
          return;
        }
        var reqData = req.getBody();
        bru.setEnvVar("password", reqData.password);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
