info:
  name: Change password
  type: http
  seq: 5

http:
  method: POST
  url: "{{gatewayBaseUri}}/api/auth/change-password"
  body:
    type: json
    data: |-
      {
        "userId": "{{userId}}",
        "oldPassword": "{{oldPassword}}",
        "newPassword": "{{newPassword}}"
      }
  auth: inherit

runtime:
  variables:
    - name: userId
      value: eef5892c-50ef-4464-bd36-21f046870fd4
    - name: refreshToken
      value: boia
    - name: newPassword
      value: feet
    - name: oldPassword
      value: feet

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
