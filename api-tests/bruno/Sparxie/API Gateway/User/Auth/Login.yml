info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{gatewayBaseUri}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  variables:
    - name: username
      value: sparkle
    - name: password
      value: feetus
    - name: email
      value: c@a.it
  scripts:
    - type: after-response
      code: |-
        var data = res.getBody();
        bru.setEnvVar("accessToken", data.accessToken);
        bru.setEnvVar("refreshToken", data.refreshToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
