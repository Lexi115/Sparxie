http:
  method: GET
  url: "{{gatewayBaseUri}}/api/auth/admin/users/{{userId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
