info:
  name: Get user by ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{gatewayBaseUri}}/api/user/{{userId}}"
  auth: inherit

runtime:
  variables:
    - name: userId
      value: e2217fe7-2978-4595-a489-0490e6b72c62

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
