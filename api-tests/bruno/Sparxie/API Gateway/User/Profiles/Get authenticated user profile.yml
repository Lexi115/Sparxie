info:
  name: Get authenticated user profile
  type: http
  seq: 1

http:
  method: GET
  url: "{{gatewayBaseUri}}/api/profiles/me"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
