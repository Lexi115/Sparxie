info:
  name: Get profile by ID
  type: http
  seq: 1

http:
  method: GET
  url: "{{gatewayBaseUri}}/api/profiles/admin/users/{{userId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
