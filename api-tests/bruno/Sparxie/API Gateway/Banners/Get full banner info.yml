info:
  name: Get full banner info
  type: http
  seq: 1

http:
  method: GET
  url: "{{gatewayBaseUri}}/api/banners/{{bannerId}}"

runtime:
  variables:
    - name: bannerId
      value: banner_character_event_sparkle_01

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
