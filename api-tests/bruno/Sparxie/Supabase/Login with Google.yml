info:
  name: Login with Google
  type: http
  seq: 6

http:
  method: GET
  url: "{{supabaseUri}}/authorize?provider=google"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: provider
      value: google
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
