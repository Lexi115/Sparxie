info:
  name: Refresh token
  type: http
  seq: 4

http:
  method: POST
  url: "{{supabaseUri}}/token?grant_type=refresh_token"
  params:
    - name: grant_type
      value: refresh_token
      type: query
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{supabaseRefreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status != 200) {
          return;
        }
        var resData = res.getBody();
        bru.setEnvVar("supabaseAccessToken", resData.access_token);
        bru.setEnvVar("supabaseRefreshToken", resData.refresh_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
