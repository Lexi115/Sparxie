info:
  name: Signup
  type: http
  seq: 1

http:
  method: POST
  url: "{{supabaseUri}}/signup"
  body:
    type: json
    data: |-
      {
        "email": "{{$randomEmail}}",
        "password": "{{$randomPassword}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status != 200) {
          return;
        }
        var reqData = req.getBody();
        bru.setEnvVar("supabaseEmail", reqData.email);
        bru.setEnvVar("supabasePassword", reqData.password);

        var resData = res.getBody();
        bru.setEnvVar("supabaseAccessToken", resData.access_token);
        bru.setEnvVar("supabaseRefreshToken", resData.refresh_token);
        bru.setEnvVar("supabaseUserId", resData.user.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
